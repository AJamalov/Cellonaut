name: Diagnostic Mutation Report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-mutations:
    name: Report deterministic core mutations
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements-mutation.txt
            pyproject.toml

      - name: Install runtime and mutation-test dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-mutation.txt

      - name: Confirm focused tests pass unchanged
        run: python -m pytest tests/test_measurement_math.py tests/test_cell_qc_helpers.py tests/test_pipeline_summary.py tests/test_pipeline_runtime.py tests/test_properties.py

      - name: Run focused mutation tests
        run: |
          mutation_status=0
          mutmut run || mutation_status=$?
          echo "Detailed mutation results:"
          mutation_results="$(mutmut results)"
          printf '%s\n' "$mutation_results"

          # Show each survivor from the four configured modules.
          echo "Surviving mutation diffs:"
          printf '%s\n' "$mutation_results" \
            | sed -n 's/^[[:space:]]*\(cellonaut\..*\): survived$/\1/p' \
            | while IFS= read -r mutant; do
                echo "===== $mutant ====="
                mutmut show "$mutant" || echo "::warning::Could not display $mutant"
              done

          # Surviving mutants are the report produced by this diagnostic job,
          # not an all-or-nothing test failure. Preserve genuine execution
          # errors, but let a completed run with classified results pass.
          if [[ "$mutation_status" -ne 0 ]] \
            && ! printf '%s\n' "$mutation_results" | grep -Eq ': (survived|timeout|suspicious|no tests)$'; then
            exit "$mutation_status"
          fi
          echo "Mutation analysis completed with status $mutation_status; review the survivor report above."
