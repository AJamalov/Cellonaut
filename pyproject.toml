[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellonaut"
dynamic = ["version"]
description = "Microscopy image analysis with Fiji Trainable Weka Segmentation and Cellpose"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Adam Jamalov" },
]
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
    "COPYRIGHT",
    "THIRD_PARTY_NOTICES.md",
    "SOURCE_AVAILABILITY.md",
]
dependencies = [
    "PySide6==6.10.3",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "tifffile==2026.9.15",
    "scikit-image==0.24.0",
    "scipy==1.13.1",
    "pillow==12.3.0",
    "defusedxml==0.7.1",
    "matplotlib==3.9.2",
    "packaging==26.3",
    "nd2==0.11.3",
    "pyimagej==1.8.0",
    "scyjava==1.12.5",
    "jpype1==1.6.0",
    "cellpose==4.2.1.1",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[project.optional-dependencies]
packaging = [
    "pip-audit==2.10.1",
    "pyinstaller==6.21.0",
]
release = [
    "pip==26.2.1",
    "setuptools==83.0.0",
    "wheel==0.47.0",
    "pip-audit==2.10.1",
    "pyinstaller==6.21.0",
    "ruff==0.8.6",
    "pytest==9.1.1",
    "pytest-cov==6.0.0",
    "hypothesis==6.138.15",
    "mypy==1.11.2",
    "pyright==1.1.411",
    "vulture==2.16",
]
windows-cuda126 = [
    "torch==2.13.0+cu126",
    "torchvision==0.28.0+cu126",
]

[project.scripts]
cellonaut = "cellonaut.app:main"

[project.urls]
Documentation = "https://github.com/AJamalov/Cellonaut#readme"
Issues = "https://github.com/AJamalov/Cellonaut/issues"
Source = "https://github.com/AJamalov/Cellonaut"

[tool.setuptools.packages.find]
include = ["cellonaut*"]

[tool.setuptools.dynamic]
version = { attr = "cellonaut.version.__version__" }

[tool.setuptools.package-data]
cellonaut = [
    "data/assets/*",
    "data/assets/**/*",
    "data/licenses/*",
    "data/presets/*",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    ".vscode",
    "__pycache__",
    "build",
    "dist",
    "installer_dist",
    "mutants",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
]
ignore = [
    "E501",
    "B904",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"release_tools/pyinstaller/pyi_rth_cellonaut_env.py" = ["I001"]
"cellonaut/app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gui: requires a Qt application and automatic top-level window cleanup",
    "integration: exercises multiple Cellonaut components or real file formats",
    "release: validates packaging, provenance, legal, or release tooling",
    "slow: comparatively expensive and suitable for exclusion from quick local runs",
    "unit: isolated behavior with controlled dependencies",
]

[tool.mutmut]
source_paths = ["cellonaut/"]
only_mutate = [
    "cellonaut/measurement/math.py",
    "cellonaut/masks/cell_qc.py",
    "cellonaut/pipeline/summary.py",
    "cellonaut/pipeline/validation.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_measurement_math.py",
    "tests/test_cell_qc_helpers.py",
    "tests/test_pipeline_summary.py",
    "tests/test_pipeline_runtime.py",
    "tests/test_properties.py",
]
mutate_only_covered_lines = true
max_stack_depth = 8
# Avoid native setproctitle calls after fork. They are cosmetic and have caused
# native crashes before any mutant is tested.
use_setproctitle = false

[tool.mypy]
python_version = "3.12"
files = ["cellonaut"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["cellonaut.gui.*"]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-overload",
    "has-type",
    "misc",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = [
    "cellonaut.masks.roi_processing",
    "cellonaut.pipeline.image_processing",
    "cellonaut.pipeline.processing_montage",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "no-redef",
]
